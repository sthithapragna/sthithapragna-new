<style>
/* Layout: a route map of the 117 episodes, one line per Season, coloured by level; a sticky detail card on the right. Single dark look on purpose, to match the course slides it is shown between. */
:root {
  color-scheme: dark;
  --bg: #0f1623;
  --panel: #152030;
  --panel-2: #1b2839;
  --line: #26354a;
  --fg: #e8edf4;
  --muted: #8b9ab0;
  --faint: #56667d;
  --accent: #f5a524;
  --l0: #8794a8;
  --l1: #3cc7a8;
  --l2: #5b9df0;
  --l3: #ec8a62;
  --l4: #b493f0;
  --display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 22px; }

header { display: grid; gap: 14px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-weight: 600; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; max-width: 520px; }
.progress span { display: block; height: 100%; background: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 13px var(--display); color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="false"] { color: var(--faint); }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.chip:focus-visible, .stop:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
@media (max-width: 980px) { main { grid-template-columns: minmax(0, 1fr); } }

.map { display: grid; gap: 4px; min-width: 0; }
.part { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 18px; padding: 14px 0; border-top: 1px solid var(--line); transition: opacity .2s; }
.part:first-child { border-top: 0; }
.part.dim { opacity: .22; }
@media (max-width: 640px) { .part { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.part-head { display: grid; gap: 4px; align-content: start; }
.part-num { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--c); text-transform: uppercase; }
.part-name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.part-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.stops { display: flex; flex-wrap: wrap; gap: 6px 0; overflow: hidden; }
.stop {
  position: relative; width: 84px; display: grid; justify-items: center; gap: 10px;
  background: none; border: 0; color: var(--fg); cursor: pointer; padding: 2px 0 4px; font: inherit;
}
.stop::before {
  content: ""; position: absolute; top: 20px; left: 50%; width: 100%; height: 3px; background: var(--c); opacity: .55;
}
.stop:last-child::before { display: none; }
.dot {
  position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font: 600 13px var(--mono); font-variant-numeric: tabular-nums;
  background: var(--bg); color: var(--c); box-shadow: inset 0 0 0 3px var(--c);
  transition: transform .15s;
}
.dot.w3 { font-size: 11.5px; letter-spacing: -.02em; }
.stop[data-status="built"] .dot { background: var(--c); color: var(--bg); }
.stop[data-status="next"] .dot { box-shadow: inset 0 0 0 3px var(--c), 0 0 0 4px var(--bg), 0 0 0 6px var(--accent); }
.stop:hover .dot { transform: scale(1.08); }
.stop.sel .dot { transform: scale(1.14); box-shadow: inset 0 0 0 3px var(--c), 0 0 0 4px var(--bg), 0 0 0 7px var(--fg); }
.paid {
  position: absolute; z-index: 2; top: -2px; left: calc(50% + 12px);
  width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center;
  font: 700 9px var(--mono); color: var(--bg); background: var(--accent); box-shadow: 0 0 0 2px var(--bg);
}
.paid.part-paid { background: var(--bg); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 2px var(--bg); }
.stop .lab { font-size: 11.5px; line-height: 1.2; color: var(--muted); text-align: center; max-width: 80px; min-height: 2.4em; }
.stop.sel .lab { color: var(--fg); font-weight: 500; }
.here {
  position: absolute; z-index: 3; top: -16px; left: 50%; transform: translateX(-50%);
  font: 600 9px var(--mono); letter-spacing: .12em; color: var(--bg); background: var(--accent);
  padding: 2px 6px; border-radius: 3px; white-space: nowrap;
}
.stops:has(.here) { padding-top: 22px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend .d { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--l0); }
.legend .d.b { background: var(--l0); }
.legend .d.n { box-shadow: inset 0 0 0 2px var(--l0), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); }
.legend .p { position: static; width: 14px; height: 14px; box-shadow: none; }

aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 980px) { aside { position: static; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card-top { padding: 18px 20px 16px; border-top: 4px solid var(--c); display: grid; gap: 10px; }
.card .ep { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--c); text-transform: uppercase; }
.card h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.facts dt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding-top: 2px; }
.facts dd { margin: 0; color: var(--fg); }
.facts dd small { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.pill.built { background: var(--c); color: var(--bg); }
.pill.next { background: var(--accent); color: var(--bg); }
.pill.planned { box-shadow: inset 0 0 0 1px var(--faint); color: var(--muted); }
.break { background: var(--panel-2); padding: 14px 20px 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.break .k { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.break .k em { font-style: normal; color: var(--faint); letter-spacing: .1em; }
.break p { margin: 0; font-size: 15px; line-height: 1.45; }
.note { padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.45; color: var(--muted); }
.nav { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.nav button {
  flex: 1; font: 500 13px var(--display); color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer;
}
.nav button:disabled { opacity: .35; cursor: default; }
.hint { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 10px; line-height: 1.6; }
.hint kbd { font-family: var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  [101, 10, "Guardrails", "Guardrails", "A shopper asks for another member's address", 0],
  [102, 10, "Deploy", "Deploy and feedback", "", 0, "planned", "FE?"],
  [103, 10, "Agent Bricks", "Agent Bricks", "", 0, "planned", "partPAID"],
  [104, 10, "Wrap", "Season wrap", "", 0],

  [105, 11, "Lakebase", "Lakebase", "Analytics queries run against the operational database", 0],
  [106, 11, "Synced tables", "Synced tables", "The app reads a synced table that is minutes behind", 0],
  [107, 11, "Store Ops app", "The Store Ops app", "", 0],
  [108, 11, "App auth", "App authentication", "The app runs as one identity, so every manager sees every store", 0],
  [109, 11, "Write-back", "Writing back", "Two managers update one stock count and a write is lost", 0],
  [110, 11, "Embed", "Embedding the assistant", "", 0],

  [111, 12, "Brief", "Capstone brief", "", 0],
  [112, 12, "Solution 1", "Capstone solution, part 1", "", 0],
  [113, 12, "Solution 2", "Capstone solution, part 2", "", 0],
  [114, 12, "Review", "Architecture review", "", 0],
  [115, 12, "Certs", "Mapping to the certifications", "", 0],
  [116, 12, "Interviews", "Interview drills", "", 0]
].map(([n, part, short, title, brk, min, status, env]) => ({ n, part, short, title, brk, min: min || EST, est: !min, status: status || "planned", env: env || "" }));

const NEXT = EPS.find(e => e.status === "next").n;
const ENV = {
  "": "Free Edition",
  "FE?": "Free Edition, to confirm in the trial fortnight",
  "PAID": "Paid trial only",
  "partPAID": "Free Edition, with a paid-trial section"
};
const pad = n => String(n).padStart(2, "0");
const lvOf = e => PARTS[e.part].lv;
const colOf = e => LEVELS[lvOf(e)].c;
const fmtH = m => `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

const ALL = [0, 1, 2, 3, 4];
let shown = new Set(ALL);
let sel = NEXT;
let here = null;

function readHash() {
  const m = /^#e(\d{1,3})$/.exec(location.hash || "");
  if (m && +m[1] < EPS.length) { here = +m[1]; sel = here; } else { here = null; }
}

function renderHeader() {
  const built = EPS.filter(e => e.status === "built");
  const builtMin = built.reduce((s, e) => s + e.min, 0);
  const total = EPS.reduce((s, e) => s + e.min, 0);
  document.getElementById("stats").innerHTML =
    `<span><b>${EPS.length}</b> episodes</span><span><b>${PARTS.length}</b> seasons</span>` +
    `<span><b>4</b> levels</span><span><b>${built.length}</b> of ${EPS.length} built</span>` +
    `<span><b>${fmtH(builtMin)}</b> built</span><span>about <b>${Math.round(total / 60)}h</b> in all</span>` +
    `<span>plus a monthly <b>What changed</b></span>`;
  document.getElementById("bar").style.width = (built.length / EPS.length * 100) + "%";
  const f = document.getElementById("filters");
  f.innerHTML = [1, 2, 3, 4].map(l =>
    `<button class="chip" style="--c:${LEVELS[l].c}" data-lv="${l}" aria-pressed="${shown.has(l)}"><i></i>${LEVELS[l].name}</button>`
  ).join("");
  f.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    const l = +b.dataset.lv;
    // first click on a level shows only that level; further clicks add or remove levels
    if (shown.size === ALL.length) shown = new Set([0, l]);
    else if (shown.has(l)) { shown.delete(l); if (![1, 2, 3, 4].some(x => shown.has(x))) shown = new Set(ALL); }
    else shown.add(l);
    renderHeader(); renderMap();
  }));
}

function renderMap() {
  const map = document.getElementById("map");
  map.innerHTML = PARTS.map(p => {
    const eps = EPS.filter(e => e.part === p.n);
    const mins = eps.reduce((s, e) => s + e.min, 0);
    const done = eps.filter(e => e.status === "built").length;
    const c = LEVELS[p.lv].c;
    const meta = done === eps.length ? "built" : done ? `${done} built` : "";
    return `<section class="part${shown.has(p.lv) ? "" : " dim"}" style="--c:${c}">
      <div class="part-head">
        <div class="part-num">Season ${p.n} &middot; ${p.range}</div>
        <div class="part-name">${p.name}</div>
        <div class="part-meta">${eps.length} episodes &middot; ${eps.some(e => e.est) ? "about " : ""}${fmtH(mins)}${meta ? " &middot; " + meta : ""}</div>
      </div>
      <div class="stops">${eps.map(e => `
        <button class="stop${e.n === sel ? " sel" : ""}" data-n="${e.n}" data-status="${e.status}" aria-label="Episode ${pad(e.n)}: ${esc(e.title)}">
          ${e.n === here ? '<span class="here">YOU ARE HERE</span>' : ""}
          ${e.env === "PAID" ? '<span class="paid" title="Paid trial only">&pound;</span>' : ""}
          ${e.env === "partPAID" ? '<span class="paid part-paid" title="Partly paid trial">&pound;</span>' : ""}
          <span class="dot${e.n > 99 ? " w3" : ""}">${pad(e.n)}</span>
          <span class="lab">${e.short}</span>
        </button>`).join("")}
      </div>
    </section>`;
  }).join("");
  map.querySelectorAll(".stop").forEach(b => b.addEventListener("click", () => select(+b.dataset.n)));
}

function renderCard() {
  const e = EPS[sel];
  const p = PARTS[e.part];
  const statusTxt = { built: "Built", next: "Next up", planned: "Planned" }[e.status];
  const card = document.getElementById("card");
  card.style.setProperty("--c", colOf(e));
  const len = e.est ? `About ${e.min} minutes <small>(estimate)</small>` : `About ${e.min} minutes`;
  const note = e.n === 0 ? `<div class="note">Recorded last: the trailer reuses clips from episodes 01 and 02.</div>` : "";
  card.innerHTML = `
    <div class="card-top">
      <div class="ep">Episode ${pad(e.n)}${e.n === here ? " &middot; you are here" : ""}</div>
      <h2>${e.title}</h2>
      <dl class="facts">
        <dt>Season</dt><dd>${p.n} &middot; ${p.name}</dd>
        <dt>Level</dt><dd>${p.range}</dd>
        <dt>Length</dt><dd>${len}</dd>
        <dt>Runs on</dt><dd>${ENV[e.env]}</dd>
        <dt>Status</dt><dd><span class="pill ${e.status}">${statusTxt}</span></dd>
      </dl>
    </div>
    ${e.brk ? `<div class="break"><div class="k">Break it${e.status === "built" ? "" : " <em>&middot; planned</em>"}</div><p>${e.brk}</p></div>` : ""}
    ${note}
    <div class="nav">
      <button id="prev" ${sel === 0 ? "disabled" : ""}>&larr; Episode ${pad(Math.max(0, sel - 1))}</button>
      <button id="next" ${sel === EPS.length - 1 ? "disabled" : ""}>Episode ${pad(Math.min(EPS.length - 1, sel + 1))} &rarr;</button>
    </div>`;
  document.getElementById("prev").onclick = () => select(sel - 1);
  document.getElementById("next").onclick = () => select(sel + 1);
}

function select(n) {
  if (n < 0 || n >= EPS.length) return;
  sel = n;
  document.querySelectorAll(".stop").forEach(b => b.classList.toggle("sel", +b.dataset.n === n));
  renderCard();
}

document.addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input, textarea")) return;
  if (ev.key === "ArrowRight") { select(sel + 1); ev.preventDefault(); }
  if (ev.key === "ArrowLeft") { select(sel - 1); ev.preventDefault(); }
});
window.addEventListener("hashchange", () => { readHash(); renderMap(); renderCard(); });

readHash();
renderHeader();
renderMap();
renderCard();
</script>

</body></html>
